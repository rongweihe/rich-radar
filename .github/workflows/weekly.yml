name: Weekly data refresh

on:
  schedule:
    # 每周一 01:00 UTC = 北京时间周一 09:00
    - cron: "0 1 * * 1"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute latest.json
        run: |
          python scripts/compute.py

      - name: Commit if changed
        run: |
          git config user.name  "rich-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history.json
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "chore(data): weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
